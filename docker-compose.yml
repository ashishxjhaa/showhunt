services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: showhunt
      POSTGRES_PASSWORD: showhunt
      POSTGRES_DB: showhunt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_ADAPTER: pg
      DATABASE_URL: postgresql://showhunt:showhunt@db:5432/showhunt
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:3000
    command: sh -c "bunx prisma migrate deploy && bun src/index.ts"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
