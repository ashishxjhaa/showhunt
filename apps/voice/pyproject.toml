[project]
name = "showhunt-voice"
version = "0.1.0"
description = "ShowHunt voice agent: Pipecat + Sarvam + DeepSeek"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "loguru>=0.7.0",
  "pipecat-ai[webrtc,sarvam,deepseek,silero,runner]>=1.8.0",
]

[dependency-groups]
dev = [
  "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
